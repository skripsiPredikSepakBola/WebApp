name: Daily Team & League State Update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: update-states
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-states:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Update team_state.json and league_state.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_states.py
      - name: Commit updated states only (never models)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/team_state.json models/league_state.json
          git diff --staged --quiet || git commit -m "chore(state): daily Elo & rolling form state update"
          git push
