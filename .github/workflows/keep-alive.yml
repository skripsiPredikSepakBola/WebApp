name: Azure Server Keep-Alive Ping

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Azure App Service Health & Sync Status
        run: |
          AZURE_URL="https://skripsiwebapp-cehte7bwece0daad.indonesiacentral-01.azurewebsites.net"
          curl --retry 3 --retry-delay 5 --max-time 60 -fsS "${AZURE_URL}/api/health"
          echo ""
          curl --retry 3 --retry-delay 5 --max-time 60 -fsS "${AZURE_URL}/api/sync/status"
          echo ""
